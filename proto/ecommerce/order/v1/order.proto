syntax = "proto3";

package ecommerce.order.v1;

import "buf/validate/validate.proto";

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_PENDING = 1;
  ORDER_STATUS_STOCK_RESERVED = 2;
  ORDER_STATUS_CONFIRMED = 3;
  ORDER_STATUS_CANCELLED = 4;
}

enum OrderFailureReason {
  ORDER_FAILURE_REASON_UNSPECIFIED = 0;
  ORDER_FAILURE_REASON_STOCK_UNAVAILABLE = 1;
  ORDER_FAILURE_REASON_PAYMENT_FAILED = 2;
  ORDER_FAILURE_REASON_PRODUCT_NOT_FOUND = 3;
  ORDER_FAILURE_REASON_INSUFFICIENT_STOCK = 4;
}

message OrderItemRequest {
  int64 product_id = 1 [(buf.validate.field).int64.gt = 0];
  int32 quantity = 2 [(buf.validate.field).int32.gt = 0];
  double unit_price = 3 [(buf.validate.field).double.gte = 0];
}

message OrderItemResponse {
  int64 product_id = 1;
  int32 quantity = 2;
  string unit_price = 3;
}

message CreateOrderRequest {
  int64 user_id = 1 [(buf.validate.field).int64.gt = 0];
  repeated OrderItemRequest items = 2 [(buf.validate.field).repeated.min_items = 1];
  // Client-generated UUID. Same key + same client => same order returned,
  // never a duplicate. Logic lands in Phase 3; the field exists now so we
  // don't need a second breaking contract change.
  string idempotency_key = 3 [(buf.validate.field).string.uuid = true];
}

message CreateOrderResponse {
  int64 order_id = 1;
  OrderStatus status = 2;
}

message GetOrderStatusRequest {
  int64 order_id = 1 [(buf.validate.field).int64.gt = 0];
}

message OrderStatusResponse {
  int64 order_id = 1;
  OrderStatus status = 2;
  OrderFailureReason failure_reason = 3;
  string total_amount = 4;
  repeated OrderItemResponse items = 5;
  string failure_detail = 6;
}

message ListOrdersRequest {
  int32 page = 1 [(buf.validate.field).int32.gte = 1];
  int32 limit = 2 [(buf.validate.field).int32.gte = 1, (buf.validate.field).int32.lte = 100];
}

message ListOrdersResponse {
  repeated OrderStatusResponse orders = 1;
  int32 page = 2;
  int32 limit = 3;
  int64 total = 4;
}

service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  rpc GetOrderStatus(GetOrderStatusRequest) returns (OrderStatusResponse);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
}
