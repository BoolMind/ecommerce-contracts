syntax = "proto3";

package ecommerce.events.v1;

import "google/protobuf/timestamp.proto";
import "buf/validate/validate.proto";

option go_package = "ecommerce/events/v1";

/*
 * Kafka order-events contract.
 *
 * All events are published to the single `order-events` topic.
 * `event_type` identifies the concrete event.
 *
 * event_id is the unique idempotency key generated by the producer/outbox.
 * event_type is the stable event discriminator.
 */

message OrderItemEvent {
  int64 product_id = 1 [
    (buf.validate.field).int64.gt = 0
  ];

  int32 quantity = 2 [
    (buf.validate.field).int32.gt = 0
  ];

  double price = 3 [
    (buf.validate.field).double.gte = 0
  ];
}

message OrderCreatedEvent {
  string event_id = 1 [
    (buf.validate.field).string.uuid = true
  ];

  string event_type = 2 [
    (buf.validate.field).string.const = "order.created"
  ];

  int64 order_id = 3 [
    (buf.validate.field).int64.gt = 0
  ];

  int64 user_id = 4 [
    (buf.validate.field).int64.gt = 0
  ];

  repeated OrderItemEvent items = 5 [
    (buf.validate.field).repeated.min_items = 1
  ];

  double total_amount = 6 [
    (buf.validate.field).double.gte = 0
  ];

  google.protobuf.Timestamp created_at = 7 [
    (buf.validate.field).required = true
  ];
}

message PaymentSucceededEvent {
  string event_id = 1 [
    (buf.validate.field).string.uuid = true
  ];

  string event_type = 2 [
    (buf.validate.field).string.const = "payment.succeeded"
  ];

  int64 order_id = 3 [
    (buf.validate.field).int64.gt = 0
  ];

  int64 user_id = 4 [
    (buf.validate.field).int64.gt = 0
  ];

  double amount = 5 [
    (buf.validate.field).double.gte = 0
  ];

  google.protobuf.Timestamp paid_at = 6 [
    (buf.validate.field).required = true
  ];
}

message PaymentFailedEvent {
  string event_id = 1 [
    (buf.validate.field).string.uuid = true
  ];

  string event_type = 2 [
    (buf.validate.field).string.const = "payment.failed"
  ];

  int64 order_id = 3 [
    (buf.validate.field).int64.gt = 0
  ];

  int64 user_id = 4 [
    (buf.validate.field).int64.gt = 0
  ];

  string reason = 5 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 1000
    }
  ];

  google.protobuf.Timestamp failed_at = 6 [
    (buf.validate.field).required = true
  ];
}

message OrderConfirmedEvent {
  string event_id = 1 [
    (buf.validate.field).string.uuid = true
  ];

  string event_type = 2 [
    (buf.validate.field).string.const = "order.confirmed"
  ];

  int64 order_id = 3 [
    (buf.validate.field).int64.gt = 0
  ];

  int64 user_id = 4 [
    (buf.validate.field).int64.gt = 0
  ];

  google.protobuf.Timestamp confirmed_at = 5 [
    (buf.validate.field).required = true
  ];
}

message OrderCancelledEvent {
  string event_id = 1 [
    (buf.validate.field).string.uuid = true
  ];

  string event_type = 2 [
    (buf.validate.field).string.const = "order.cancelled"
  ];

  int64 order_id = 3 [
    (buf.validate.field).int64.gt = 0
  ];

  int64 user_id = 4 [
    (buf.validate.field).int64.gt = 0
  ];

  string reason = 5 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 1000
    }
  ];

  google.protobuf.Timestamp cancelled_at = 6 [
    (buf.validate.field).required = true
  ];
}
